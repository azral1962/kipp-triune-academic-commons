name: Tugas artefak
description: Rencanakan atau lacak penyelesaian artefak
labels: [artifact]
body:
  - type: input
    id: artifact_id
    attributes:
      label: ID artefak
      placeholder: K-L01
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Tim penanggung jawab
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Sasaran pengguna dan ukuran sukses
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pekerjaan dan bukti uji
    validations:
      required: true
